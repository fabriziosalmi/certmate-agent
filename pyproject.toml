[project]
name = "certmate-agent"
version = "0.2.0"
description = "Lightweight assistant agent for CertMate. Deterministic intent routing + local LLM fallback (LMStudio)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Tetto su 0.16: ruff 0.16 ha allargato le regole di default e segnala 43
    # errori su codice che con 0.15 era pulito (15 dei quali BLE001, gestione
    # delle eccezioni). Adottare quelle regole e' una revisione del codice da
    # fare apposta, non un effetto collaterale di un pip install.
    "ruff>=0.7,<0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
