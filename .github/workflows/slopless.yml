# Static analysis for AI-slop patterns: https://github.com/fabriziosalmi/slopless
#
# Errors fail the build. Warnings only report.
#
# Findings reach the Security tab on a push and on a pull request from this
# repository. A fork gets a read-only token whatever `permissions:` says, so its
# findings stay in the job log; the build still fails on an error either way.
name: slopless

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    name: AI-slop static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to a commit rather than @v1: a moving tag means trusting the
      # upstream repository not to change under us.
      - name: Run slopless
        uses: fabriziosalmi/slopless@9aae74e5e7304bbbfceda29e921a6d698a53f609 # v1.8.0
        with:
          patterns: "widget/*.js *.md"
          format: sarif
          output: slopless.sarif

      - name: Upload findings to code scanning
        if: >-
          always()
          && hashFiles('slopless.sarif') != ''
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: slopless.sarif
          category: slopless
